name: billion-work-dev
services:
  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_DATABASE: ${DB_NAME:-billion_work}
      MARIADB_USER: ${DB_USERNAME:-billion_work}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in infra/.env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  backend:
    profiles: ["app"]
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:mariadb://db:3306/${DB_NAME:-billion_work}
      DB_USERNAME: ${DB_USERNAME:-billion_work}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in infra/.env}
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
